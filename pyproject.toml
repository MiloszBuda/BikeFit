[project]
name = "bikefit"
version = "0.1.0"
description = "Bike fitting computer vision analysis: video to keypoints and recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "rtmlib>=0.0.16",
    "onnxruntime>=1.16.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.30.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
bikefit = "bikefit.cli:main"
bikefit-ui = "bikefit.ui.app:run_app"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring real ONNX weights",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
